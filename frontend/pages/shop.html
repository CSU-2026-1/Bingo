<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BINGO | Магазин</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <aside class="app-sidebar" aria-label="BINGO navigation">
      <div class="side-brand">
        <span>BINGO</span>
      </div>
      <nav class="side-nav">
        <a class="side-nav-link" href="./home.html">Главная</a>
        <a class="side-nav-link" href="./lobby.html">Комнаты</a>
        <a class="side-nav-link" href="./shop.html">Магазин</a>
        <a class="side-nav-link" href="./rules.html">Правила</a>
        <a class="side-nav-link" href="./profile.html">Профиль</a>
      </nav>
      <button class="side-nav-logout" id="navLogoutButton" type="button">Выйти</button>
    </aside>

    <main class="auth-shell">
      <section class="auth-scene home-scene" aria-label="Магазин карточек BINGO">
        <div class="signal-panel" aria-hidden="true">
          <span class="signal-line signal-line-a"></span>
          <span class="signal-line signal-line-b"></span>
          <span class="signal-line signal-line-c"></span>
        </div>

        <article class="auth-card shop-card">
          <div class="auth-kicker">BINGO SHOP</div>
          <h1 class="auth-title" data-text="Магазин">Магазин</h1>
          <p class="auth-subtitle" id="shopStatus">Загружаем каталог...</p>

          <div class="shop-balance">
            <span>Ваш баланс:</span>
            <strong id="shopBalance">0</strong>
            <span>монет</span>
          </div>

          <div class="shop-catalog" id="shopCatalog"></div>

          <div class="shop-result is-hidden" id="shopResult">
            <h3 class="shop-result-title">Вы получили карточку!</h3>
            <div class="shop-result-card" id="shopResultCard"></div>
            <button class="auth-button" id="shopResultClose" type="button">
              <span>Закрыть</span>
            </button>
          </div>
        </article>
      </section>
    </main>

    <script src="../js/api.js?v=ui-1"></script>
    <script src="../js/nav.js?v=ui-1"></script>
    <script src="../js/shop.js?v=ui-1"></script>
  </body>
</html>
